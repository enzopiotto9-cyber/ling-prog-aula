<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Veja o que os alunos acharam das aulas de Java e deixe o seu comentário">
    <meta name="author" content="Pioto">
    <meta name="theme-color" content="#b91c1c">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b91c1c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EJava%3C/text%3E%3C/svg%3E">
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Comentários | Aprenda Java</title>
</head>

<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <header class="banner-logo-inicial">
        <h1>Comentários</h1>
    </header>

    <nav class="menu-navegacao-inicio" aria-label="Navegação principal">
        <ul class="bottons-navegacao-inicio">
            <li class="voltar-principal"><a href="../home-principal.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Página principal</a></li>
            <li><a href="./home.html"><i class="fa-solid fa-house" aria-hidden="true"></i> Home</a></li>
            <li><a href="./aula.html"><i class="fa-solid fa-book" aria-hidden="true"></i> Aulas</a></li>
            <li><a href="./servicos.html"><i class="fa-solid fa-truck" aria-hidden="true"></i> Serviços</a></li>
            <li><a href="./comentarios.html" class="ativo" aria-current="page"><i class="fa-solid fa-comment" aria-hidden="true"></i> Comentários</a></li>
            <li><a href="./suporte.html"><i class="fa-solid fa-phone" aria-hidden="true"></i> Suporte</a></li>
            <li><a href="./horarios.html"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Horários</a></li>
        </ul>
    </nav>

    <main id="conteudo">
        <div class="barra-ferramentas">
            <form class="busca" role="search" onsubmit="return false">
                <label for="campo-busca" class="so-leitor-de-tela">Pesquisar comentários</label>
                <input id="campo-busca" type="search" placeholder="Pesquisar comentário..." />
                <button type="submit">Buscar</button>
            </form>
            <div class="acessibilidade">
                <button type="button" id="btn-acessibilidade" aria-label="Acessibilidade" title="Acessibilidade"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
                <button type="button" id="btn-config" aria-label="Configurações do site" title="Configurações do site"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
            </div>
        </div>

        <div class="comentarios-layout">
            <section class="novo-comentario" aria-labelledby="titulo-form">
                <h2 id="titulo-form">Deixe seu comentário</h2>
                <form id="form-comentario">
                    <label for="nome">Seu nome</label>
                    <input id="nome" type="text" maxlength="40" required autocomplete="name">

                    <label for="nota">Nota para as aulas</label>
                    <select id="nota" required>
                        <option value="5">5 - Excelente</option>
                        <option value="4">4 - Muito bom</option>
                        <option value="3">3 - Bom</option>
                        <option value="2">2 - Regular</option>
                        <option value="1">1 - Ruim</option>
                    </select>

                    <label for="texto">Comentário</label>
                    <textarea id="texto" rows="5" maxlength="300" required></textarea>
                    <p class="contador" id="contador" aria-live="off">0 / 300</p>

                    <button type="submit" class="botao-principal">Publicar comentário</button>
                    <p id="mensagem" class="mensagem" role="status"></p>
                </form>
            </section>

            <section class="lista-comentarios" aria-labelledby="titulo-lista">
                <h2 id="titulo-lista">O que os alunos dizem</h2>
                <p class="resumo" id="resumo" role="status"></p>
                <ul id="comentarios"></ul>
            </section>
        </div>
    </main>

    <footer class="rodape">
        <p>Seu comentário ajuda outros alunos a escolher por onde começar.</p>
    </footer>

    <script>
        const CHAVE = 'comentarios';
        const exemplos = [
            { nome: 'Ana', nota: 5, texto: 'Comecei sem saber nada e em poucas aulas criei meu primeiro programa. Os exercícios ajudaram muito.', data: '2026-09-02', exemplo: true },
            { nome: 'Carlos', nota: 4, texto: 'Explicações claras e diretas. Queria mais aulas sobre streams depois da parte de coleções.', data: '2026-09-10', exemplo: true },
            { nome: 'Marina', nota: 5, texto: 'Gostei da parte de classes, finalmente entendi para que serve o construtor.', data: '2026-09-18', exemplo: true }
        ];

        let salvos = [];
        try { salvos = JSON.parse(localStorage.getItem(CHAVE) || '[]'); } catch (e) { salvos = []; }

        const lista = document.getElementById('comentarios');
        const resumo = document.getElementById('resumo');
        const campo = document.getElementById('campo-busca');
        const form = document.getElementById('form-comentario');
        const texto = document.getElementById('texto');
        const contador = document.getElementById('contador');
        const mensagem = document.getElementById('mensagem');

        function salvar() {
            try { localStorage.setItem(CHAVE, JSON.stringify(salvos)); } catch (e) { }
        }

        function dataBr(iso) {
            return new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR');
        }

        function estrelas(n) {
            return '★'.repeat(n) + '☆'.repeat(5 - n);
        }

        function render() {
            const termo = campo.value.trim().toLowerCase();
            const todos = [...salvos, ...exemplos];
            const visiveis = todos.filter(c => (c.nome + ' ' + c.texto).toLowerCase().includes(termo));

            lista.replaceChildren();
            visiveis.forEach(c => {
                const li = document.createElement('li');
                li.className = 'comentario';

                const topo = document.createElement('div');
                topo.className = 'comentario-topo';
                const nome = document.createElement('strong');
                nome.textContent = c.nome;
                const nota = document.createElement('span');
                nota.className = 'estrelas';
                nota.textContent = estrelas(c.nota);
                nota.setAttribute('role', 'img');
                nota.setAttribute('aria-label', 'Nota ' + c.nota + ' de 5');
                topo.append(nome, nota);

                const corpo = document.createElement('p');
                corpo.textContent = c.texto;

                const rodape = document.createElement('div');
                rodape.className = 'comentario-rodape';
                const data = document.createElement('span');
                data.textContent = dataBr(c.data) + (c.exemplo ? ' · exemplo' : '');
                rodape.append(data);

                if (!c.exemplo) {
                    const apagar = document.createElement('button');
                    apagar.type = 'button';
                    apagar.textContent = 'Apagar';
                    apagar.addEventListener('click', () => {
                        salvos = salvos.filter(s => s !== c);
                        salvar();
                        render();
                    });
                    rodape.append(apagar);
                }

                li.append(topo, corpo, rodape);
                lista.append(li);
            });

            if (!visiveis.length) {
                resumo.textContent = 'Nenhum comentário encontrado.';
            } else {
                const media = visiveis.reduce((s, c) => s + c.nota, 0) / visiveis.length;
                resumo.textContent = visiveis.length + ' comentário(s) · nota média ' + media.toFixed(1).replace('.', ',') + ' de 5';
            }
        }

        texto.addEventListener('input', () => { contador.textContent = texto.value.length + ' / 300'; });
        campo.addEventListener('input', render);

        form.addEventListener('submit', e => {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const msg = texto.value.trim();
            if (!nome || !msg) { mensagem.textContent = 'Preencha o nome e o comentário.'; return; }
            salvos.unshift({
                nome, texto: msg,
                nota: Number(document.getElementById('nota').value),
                data: new Date().toISOString().slice(0, 10)
            });
            salvar();
            form.reset();
            contador.textContent = '0 / 300';
            mensagem.textContent = 'Comentário publicado!';
            render();
        });


        render();
    </script>
    <script src="./js/site.js" defer></script>
</body>

</html>
